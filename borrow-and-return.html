<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mượn và trả sách - Thư viện</title>
    <link rel="stylesheet" href="css/borrow-and-return.css">
</head>
<body>
    <main class="page">
        <aside class="sidebar">
            <h2>Thư viện</h2>
            <p class="sidebar-description">Quản lý sách và mượn trả</p>
            <nav>
                <a href="catalog.html" class="nav-link">Tra cứu sách</a>
                <a href="borrow-and-return.html" class="nav-link active" aria-current="page">Mượn và trả sách</a>
            </nav>
        </aside>
        <section class="content">
            <h1>Quản lý mượn và trả sách</h1>
            <p class="intro">Tạo phiếu mượn mới và theo dõi trạng thái trả sách của độc giả.</p>
            <div class="borrow-layout">
                <section class="borrow-panel" aria-labelledby="borrowFormTitle">
                    <h2 class="panel-title" id="borrowFormTitle">Lập phiếu mượn sách</h2>
                    <form id="borrowForm" class="borrow-form">
                        <div class="form-field">
                            <label for="studentId">Mã sinh viên / độc giả</label>
                            <input type="text" id="studentId" name="studentId" autocomplete="off" required>
                        </div>
                        <div class="form-field">
                            <label for="bookName">Tên sách mượn</label>
                            <input type="text" id="bookName" name="bookName" autocomplete="off" required>
                        </div>
                        <div class="form-field">
                            <label for="borrowDate">Ngày mượn</label>
                            <input type="date" id="borrowDate" name="borrowDate" required>
                        </div>
                        <div class="form-field">
                            <label for="dueDate">Ngày hẹn trả</label>
                            <input type="date" id="dueDate" name="dueDate" required>
                        </div>
                        <button type="submit" class="primary-button">Xác nhận cho mượn</button>
                    </form>
                </section>
                <section class="borrow-panel" aria-labelledby="borrowListTitle">
                    <h2 class="panel-title" id="borrowListTitle">Danh sách phiếu mượn</h2>
                    <div class="table-wrap">
                        <table class="borrow-table">
                            <thead>
                                <tr>
                                    <th scope="col">Mã SV</th>
                                    <th scope="col">Tên sách</th>
                                    <th scope="col">Ngày mượn</th>
                                    <th scope="col">Hẹn trả</th>
                                    <th scope="col">Trạng thái</th>
                                    <th scope="col">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="borrowTableBody">
                                <tr id="emptyRow">
                                    <td colspan="6" class="empty-row">Chưa có phiếu mượn nào được lập.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </section>
    </main>
    <script>
        const borrowForm = document.getElementById('borrowForm');
        const studentIdInput = document.getElementById('studentId');
        const bookNameInput = document.getElementById('bookName');
        const borrowDateInput = document.getElementById('borrowDate');
        const dueDateInput = document.getElementById('dueDate');
        const tableBody = document.getElementById('borrowTableBody');

        function setBorrowDateToToday() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            borrowDateInput.value = `${year}-${month}-${day}`;
        }
        function appendTextCell(row, value, className = '') {
            const cell = document.createElement('td');
            if (className) cell.className = className;
            cell.textContent = value;
            row.appendChild(cell);
            return cell;
        }
        function createStatusBadge(label, statusClass) {
            const badge = document.createElement('span');
            badge.className = `borrow-status ${statusClass}`;
            badge.textContent = label;
            return badge;
        }
        function addBorrowRecord(event) {
            event.preventDefault();
            const studentId = studentIdInput.value.trim();
            const bookName = bookNameInput.value.trim();
            const borrowDate = borrowDateInput.value;
            const dueDate = dueDateInput.value;
            dueDateInput.setCustomValidity('');
            if (dueDate < borrowDate) {
                dueDateInput.setCustomValidity('Ngày hẹn trả không được trước ngày mượn.');
                dueDateInput.reportValidity();
                return;
            }
            const emptyRow = document.getElementById('emptyRow');
            if (emptyRow) emptyRow.remove();
            const row = document.createElement('tr');
            appendTextCell(row, studentId, 'cell-strong');
            appendTextCell(row, bookName, 'cell-strong');
            appendTextCell(row, borrowDate, 'date-cell');
            appendTextCell(row, dueDate, 'date-cell');
            const statusCell = document.createElement('td');
            statusCell.className = 'status-cell';
            statusCell.appendChild(createStatusBadge('Đang mượn', 'borrowing'));
            row.appendChild(statusCell);
            const actionCell = document.createElement('td');
            const returnButton = document.createElement('button');
            returnButton.type = 'button';
            returnButton.className = 'action-button return-button';
            returnButton.textContent = 'Đã trả';
            returnButton.addEventListener('click', () => returnBook(returnButton));
            actionCell.appendChild(returnButton);
            row.appendChild(actionCell);
            tableBody.prepend(row);
            borrowForm.reset();
            setBorrowDateToToday();
        }
        function returnBook(button) {
            const row = button.closest('tr');
            const statusCell = row.querySelector('.status-cell');
            statusCell.replaceChildren(createStatusBadge('Đã trả', 'returned'));
            button.disabled = true;
            button.textContent = 'Đã hoàn tất';
            button.classList.add('is-complete');
        }
        borrowForm.addEventListener('submit', addBorrowRecord);
        dueDateInput.addEventListener('input', () => dueDateInput.setCustomValidity(''));
        setBorrowDateToToday();
    </script>
</body>
</html>
