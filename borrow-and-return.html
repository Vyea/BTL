<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mượn và trả sách - Thư viện</title>
    <link rel="stylesheet" href="css/borrow-and-return.css">
</head>
<body>
    <main class="page">
        <aside class="sidebar">
            <h2>Thư viện</h2>
            <p class="sidebar-description">Quản lý sách và mượn trả</p>
            <nav>
                <a href="catalog.html" class="nav-link">Tra cứu sách</a>
                <a href="borrow-and-return.html" class="nav-link active" aria-current="page">Mượn và trả sách</a>
            </nav>
        </aside>
        <section class="content">
            <h1>Quản lý mượn và trả sách</h1>
            <p class="intro">Tạo phiếu mượn mới và theo dõi trạng thái trả sách của độc giả.</p>
            <div class="borrow-layout">
                <section class="borrow-panel" aria-labelledby="borrowFormTitle">
                    <h2 class="panel-title" id="borrowFormTitle">Lập phiếu mượn sách</h2>
                    <form id="borrowForm" class="borrow-form">
                        <div class="form-field">
                            <label for="studentId">Mã sinh viên / độc giả</label>
                            <input type="text" id="studentId" name="studentId" autocomplete="off" required>
                        </div>
                        <div class="form-field">
                            <label for="bookName">Tên sách mượn</label>
                            <input type="text" id="bookName" name="bookName" autocomplete="off" required>
                        </div>
                        <div class="form-field">
                            <label for="borrowDate">Ngày mượn</label>
                            <input type="date" id="borrowDate" name="borrowDate" required>
                        </div>
                        <div class="form-field">
                            <label for="dueDate">Ngày hẹn trả</label>
                            <input type="date" id="dueDate" name="dueDate" required>
                        </div>
                        <button type="submit" class="primary-button">Xác nhận cho mượn</button>
                    </form>
                </section>
                <section class="borrow-panel" aria-labelledby="borrowListTitle">
                    <h2 class="panel-title" id="borrowListTitle">Danh sách phiếu mượn</h2>
                    <div class="table-wrap">
                        <table class="borrow-table">
                            <thead>
                                <tr>
                                    <th scope="col">Mã SV</th>
                                    <th scope="col">Tên sách</th>
                                    <th scope="col">Ngày mượn</th>
                                    <th scope="col">Hẹn trả</th>
                                    <th scope="col">Trạng thái</th>
                                    <th scope="col">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="borrowTableBody">
                                <tr id="emptyRow">
                                    <td colspan="6" class="empty-row">Chưa có phiếu mượn nào được lập.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </section>
    </main>
    <script src="js/borrow-and-return.js"></script>
</body>
</html>
